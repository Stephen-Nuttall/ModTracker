name: Deploy PyServer

on:
  push:
    branches: ['beta-5.0']

  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './WebApp/pyserver_requirements.txt'
      - name: Install dependencies
        working-directory: ./WebApp
        run: pip install -r pyserver_requirements.txt
      - name: Run FastAPI server
        working-directory: ./WebApp
        run: uvicorn pyServer:app --host 0.0.0.0 --port 8000