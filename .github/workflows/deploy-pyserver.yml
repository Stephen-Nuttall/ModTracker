name: Deploy PyServer

on:
  push:
    branches: ['beta-5.0']

  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './WebApp/pyserver_requirements.txt'

      - name: Install dependencies
        working-directory: ./WebApp
        run: pip install -r pyserver_requirements.txt

      - name: Create API_Keys.py from secrets
        working-directory: ./WebApp
        env:
          API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          umask 077
          cat > API_Keys.py <<'EOF'
          CurseForge = "${API_KEY}"
          EOF
          chmod 600 API_Keys.py

      - name: Run FastAPI server
        working-directory: ./WebApp
        run: uvicorn pyServer:app --host 0.0.0.0 --port 8000